services:
  server:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_PATH: /app/data/db.sqlite
      NODE_ENV: development
      JWT_SECRET: dev-secret-change-me
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin
      CORS_ORIGIN: ""
    volumes:
      - ./server:/app
      - server_modules:/app/node_modules
      - db-data:/app/data
    command: sh -c "npm install && node --watch index.js"

  client:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://server:3000
    volumes:
      - ./client:/app
      - client_modules:/app/node_modules
    command: sh -c "npm install && npx vite --host"
    depends_on:
      - server

volumes:
  server_modules:
  client_modules:
  db-data:
